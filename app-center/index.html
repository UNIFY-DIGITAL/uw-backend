<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Center</title>
  <!-- Filled in by scripts/deploy-app-center.sh: this server's SDK and the brand. -->
  <script src="%SDK_URL%"></script>
  <style>
    :root {
      --bg: #f7f8fa; --card: #ffffff; --text: #1b1f24; --muted: #667080; --line: #e3e6ea;
      --accent: #2563eb; --accent-text: #ffffff; --focus: #93b4f5;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --card: #1a1e24; --text: #e6e9ee; --muted: #98a2ae; --line: #2a3038;
              --accent: #4f8cff; --accent-text: #0b0d10; --focus: #35538c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding: 28px 24px 8px; max-width: 1040px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { margin: 0 0 18px; color: var(--muted); }
    input[type=search] { width: 100%; padding: 11px 14px; font: inherit; color: var(--text); background: var(--card);
      border: 1px solid var(--line); border-radius: 10px; outline: none; }
    input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
    main { max-width: 1040px; margin: 0 auto; padding: 16px 24px 40px; display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
      display: flex; flex-direction: column; gap: 10px; }
    .top { display: flex; gap: 12px; align-items: center; }
    .top img { width: 44px; height: 44px; border-radius: 10px; flex: none; }
    .title { font-weight: 600; }
    .desc { color: var(--muted); font-size: 13.5px; flex: 1; }
    button { align-self: flex-start; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
      padding: 7px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1><span id="brand">%BRAND_NAME%</span> App Center</h1>
    <p class="sub">Every app in your organisation's suite. Each opens in a new tab.</p>
    <input id="q" type="search" placeholder="Search apps — documents, sheets, mail…" aria-label="Search apps" autofocus>
  </header>
  <main id="grid" aria-live="polite"></main>
  <script>
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    let catalog = [];

    // Search matches names and descriptions, plus a few everyday words people
    // reach for ("word", "excel", "slides") that the titles don't contain.
    const aliases = {
      'word-processor': 'word docs doc writer', spreadsheet: 'excel sheets sheet table',
      presentation: 'powerpoint slides deck keynote', 'pdf-editor': 'acrobat sign',
      email: 'mail inbox outlook gmail', calendar: 'meetings schedule events',
      contacts: 'people address book', tasks: 'todo to-do', projects: 'kanban board trello',
    };

    function render() {
      const term = q.value.trim().toLowerCase();
      const shown = catalog.filter((a) => !term ||
        `${a.title} ${a.description} ${a.name} ${aliases[a.name] || ''}`.toLowerCase().includes(term));
      grid.replaceChildren();
      if (!shown.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = catalog.length ? `No app matches “${q.value}”.` : 'No apps have been deployed yet.';
        grid.append(p);
        return;
      }
      for (const app of shown) {
        const card = document.createElement('div');
        card.className = 'card';
        const top = document.createElement('div');
        top.className = 'top';
        const img = document.createElement('img');
        img.src = app.icon || '';
        img.alt = '';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = app.title;
        top.append(img, title);
        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = app.description;
        const open = document.createElement('button');
        open.type = 'button';
        open.textContent = 'Open';
        open.setAttribute('aria-label', `Open ${app.title}`);
        // A new tab per app, as the apps button does: switching apps is switching tabs.
        open.addEventListener('click', () => window.open(app.url, '_blank', 'noopener'));
        card.append(top, desc, open);
        grid.append(card);
      }
    }

    q.addEventListener('input', render);
    // The organisation's apps, from this server (the Admin console turns apps on and off).
    fetch(`${puter.APIOrigin}/unify/apps`, { headers: { Authorization: `Bearer ${puter.authToken}` }, cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
      .then((body) => { catalog = body.apps.filter((a) => a.name !== 'app-center'); render(); })
      .catch(() => { grid.innerHTML = '<p class="empty">The app catalogue could not be loaded.</p>'; });
  </script>
</body>
</html>
