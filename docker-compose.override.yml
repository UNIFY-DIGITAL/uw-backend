# Local additions on top of Puter's own docker-compose.yml.
#
# Every image is pinned by digest and named ${REGISTRY:-docker.io}/...: left
# unset (.env.example, any developer's machine) they come from Docker Hub and
# GitHub's registry; set (.env.production.example: our Artifact Registry) the
# very same images, by the same digests, come from our own copy. Copy a new or
# changed image there with scripts/mirror-images.sh.
services:
  puter:
    # The image is pinned by digest: re-checking the registry on every start
    # only slows starts down (and needs the internet). scripts/upgrade-puter.sh
    # pulls a new pin explicitly.
    pull_policy: missing
    environment:
      # Puter 26.10.1 (Node 26 image): modules installed for the backend
      # workspace (sharp, ...) sit in src/backend/node_modules, out of reach of
      # the compiled code in dist/, and the server fails to start ("Cannot find
      # module 'sharp'"). A fallback search path; harmless once upstream fixes it.
      NODE_PATH: /opt/puter/src/backend/node_modules
    volumes:
      # Our /email/send extension, mounted where the image's own extensions
      # live so `@heyputer/backend/...` and `nodemailer` resolve.
      - ./extensions/usersend:/opt/puter/dist/extensions/usersend:ro,z
      # Admin-only account creation (sign-up is off): POST /admin/users.
      - ./extensions/useradmin:/opt/puter/dist/extensions/useradmin:ro,z
      # The desktop's puter.js talks to this server from its first line, never puter.com.
      - ./extensions/unifyorigin:/opt/puter/dist/extensions/unifyorigin:ro,z
      # The desktop page without its preload of Puter's CDN wallpaper
      # (scripts/patch-puter.sh makes it from the pinned image; re-run on an image change).
      - ./puter/patches/PuterHomepageService.js:/opt/puter/dist/src/backend/services/homepage/PuterHomepageService.js:ro,z
      # Google sign-ups named after their address, not a random guest-like name (same script).
      - ./puter/patches/OIDCService.js:/opt/puter/dist/src/backend/services/auth/OIDCService.js:ro,z
      - ./puter/patches/SuggestedAppsService.js:/opt/puter/dist/src/backend/services/apps/SuggestedAppsService.js:ro,z
      # Emails and the SDK's dialogs with our brand, support address and links (same script).
      - ./puter/patches/EmailClient.js:/opt/puter/dist/src/backend/clients/email/EmailClient.js:ro,z
      # Confirmation codes expire (same script).
      - ./puter/patches/AuthController.js:/opt/puter/dist/src/backend/controllers/auth/AuthController.js:ro,z
      # Sign-up mails the code, not a link (same script).
      - ./puter/patches/SignupService.js:/opt/puter/dist/src/backend/services/user/SignupService.js:ro,z
      # AI: the suite's model for apps that ask for one this server does not have (same script).
      - ./puter/patches/ChatCompletionDriver.js:/opt/puter/dist/src/backend/drivers/ai-chat/ChatCompletionDriver.js:ro,z
      # Gemini 3: a turn's tool calls go back in order, its thought signature on the first (same script).
      - ./puter/patches/GeminiChatProvider.js:/opt/puter/dist/src/backend/drivers/ai-chat/providers/gemini/GeminiChatProvider.js:ro,z
      - ./puter/patches/HomepageController.js:/opt/puter/dist/src/backend/controllers/homepage/HomepageController.js:ro,z
      - ./puter/patches/puter.js:/opt/puter/src/puter-js/dist/puter.js:ro,z
      # The suite's app list, for the admin extension (Admin console, App Center, apps button).
      - ./suite-apps.json:/etc/puter/suite-apps.json:ro,z
      # The desktop rebuilt with our branding extension (scripts/build-desktop.sh,
      # gui-extensions/). Brand name, logos and wallpaper come from config.json
      # "gui_params". Remove this line to go back to the stock desktop.
      - ./vendor/puter/src/gui/dist:/opt/puter/src/gui/dist:ro,z
  mailhog:
    # Stands in for the outbound SMTP relay (Google Workspace, Microsoft 365,
    # or your own mail server in real use): everything sent to an outside
    # address lands here instead of on the internet.
    image: ${REGISTRY:-docker.io}/mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: puter-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web UI, this machine only
  apps:
    # The suite's apps (built static files from ~/everything/src/<app>/dist),
    # served for Puter to open in its desktop. In production this is any web
    # server or CDN on the organisation's domain.
    image: ${REGISTRY:-docker.io}/library/nginx:alpine@sha256:060849a174666c53439dc7cecbf8f67e225c7cbfb1a44ca97915d9a172a81e6d
    container_name: puter-apps
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"   # this machine only; browsers use apps.<domain> via Caddy
    volumes:
      - ./apps:/usr/share/nginx/html:ro,z
      # <host>.<domain> -> apps/<host>/ (generated by scripts/configure.sh)
      - ./nginx/apps.conf:/etc/nginx/conf.d/default.conf:ro,z
  caddy:
    image: ${REGISTRY:-docker.io}/library/caddy:2.11-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    volumes:
      # The app sub-domains and the chat back end (generated by scripts/configure.sh).
      - ./caddy/apps.caddy:/etc/caddy/apps.caddy:ro,z
      # HTTP or HTTPS (.env TLS_MODE), also generated by scripts/configure.sh.
      - ./caddy/sites.caddy:/etc/caddy/sites.caddy:ro,z
    ports:
      # HTTPS (TLS_MODE files or auto); unused locally. HTTP is in docker-compose.yml.
      - "${HTTPS_PORT:-443}:443"
    networks:
      default:
        # Containers reach Puter by the same names browsers use, so the chat
        # server's calls (and the tokens Puter issues) match a browser's, and
        # never leave the host. PUTER_DOMAIN in .env = config.json "domain".
        aliases:
          - ${PUTER_DOMAIN:?set PUTER_DOMAIN in .env}
          - api.${PUTER_DOMAIN:?set PUTER_DOMAIN in .env}
          - js.${PUTER_DOMAIN:?set PUTER_DOMAIN in .env}
          - s3.${PUTER_DOMAIN:?set PUTER_DOMAIN in .env}
  chat:
    # Teamchat's back end on our own server (chat-server/server.mjs), at
    # http(s)://chat-api.<domain> through Caddy. All chat data lives in the
    # CHAT_SERVICE_USER account on Puter (key-value store + drive).
    image: ${REGISTRY:-docker.io}/library/node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    container_name: puter-chat
    restart: unless-stopped
    depends_on:
      puter:
        condition: service_started
    working_dir: /app
    command: ["node", "server.mjs"]
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    volumes:
      - ./chat-server:/app:ro,z
    environment:
      CHAT_PORT: "8787"
      # Every address from the one domain in .env.
      PUTER_ORIGIN: ${PUTER_PROTOCOL:-http}://${PUTER_DOMAIN:?set PUTER_DOMAIN in .env}
      PUTER_API_ORIGIN: ${PUTER_PROTOCOL:-http}://api.${PUTER_DOMAIN:?set PUTER_DOMAIN in .env}
      PUTER_SDK_URL: ${PUTER_PROTOCOL:-http}://js.${PUTER_DOMAIN:?set PUTER_DOMAIN in .env}/v2/
      CHAT_SERVICE_USER: ${CHAT_SERVICE_USER:-unifychat}
      CHAT_SERVICE_PASSWORD: ${CHAT_SERVICE_PASSWORD:?set CHAT_SERVICE_PASSWORD in .env}
      CHAT_ORG_NAME: ${CHAT_ORG_NAME:-Unify Works}
      CHAT_ORG_AUTOJOIN: ${CHAT_ORG_AUTOJOIN:-true}
      CHAT_ORG_EXCLUDE: ${CHAT_ORG_EXCLUDE:-admin}
      # Trial: everyone may create (and invite to) workspaces; the shared one only with TRIAL_CHAT=1.
      SUITE_MODE: ${SUITE_MODE:-organisation}
      TRIAL_CHAT: ${TRIAL_CHAT:-0}
      # Admins of the organisation's workspace besides the suite's administrators.
      CHAT_ADMINS: ${CHAT_ADMINS:-}
      # Chat -> Calendar: invitations shared in chat go to members' mailboxes.
      CHAT_MAIL_DOMAIN: ${MAIL_DOMAIN:?set MAIL_DOMAIN in .env}
      UNIFY_INTERNAL_SECRET: ${UNIFY_INTERNAL_SECRET:-}
      # Calls: the signaller at /signal, and relay logins for coturn (below).
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: turn:${TURN_HOST:-127.0.0.1}:3478?transport=udp,turn:${TURN_HOST:-127.0.0.1}:3478?transport=tcp
      STUN_URLS: stun:${TURN_HOST:-127.0.0.1}:3478
  coturn:
    # Our own TURN/STUN relay for calls (huddles, Meetings), instead of
    # Cloudflare's. Logins are short-lived (TURN REST, use-auth-secret): the
    # chat server mints them for signed-in users only.
    #   3478 tcp/udp   STUN/TURN        49160-49200/udp   relayed media
    # TURN_BIND: 127.0.0.1 here; 0.0.0.0 (plus firewall rules) on a server.
    image: ${REGISTRY:-docker.io}/coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    container_name: puter-coturn
    restart: unless-stopped
    ports:
      - "${TURN_BIND:-127.0.0.1}:3478:3478/udp"
      - "${TURN_BIND:-127.0.0.1}:3478:3478/tcp"
      - "${TURN_BIND:-127.0.0.1}:49160-49200:49160-49200/udp"
    environment:
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1}
      TURN_REALM: ${PUTER_DOMAIN:?set PUTER_DOMAIN in .env}
      TURN_ALLOW_LOOPBACK: ${TURN_ALLOW_LOOPBACK:-false}
    # The image's entrypoint expands each argument ($$ = from this environment).
    command:
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=$${TURN_EXTERNAL_IP}
      - --realm=$${TURN_REALM}
      - --use-auth-secret
      - --static-auth-secret=$${TURN_SECRET}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Never relay into the host's metadata / link-local addresses.
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      # Local only (TURN_ALLOW_LOOPBACK=true): two browsers on this machine.
      - $$( [ "$${TURN_ALLOW_LOOPBACK}" = true ] && echo --allow-loopback-peers || echo --no-multicast-peers )
      - --log-file=stdout
      - --simple-log
  puter-smtp:
    pull_policy: missing
    environment:
      NODE_PATH: /opt/puter/src/backend/node_modules   # see puter above
    # The image's own health check probes Puter's web port (4100), which the
    # SMTP receiver does not serve, so it always read "unhealthy". Check the
    # SMTP port instead.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(2525,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
  valkey:
    image: ${REGISTRY:-docker.io}/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
  mariadb:
    image: ${REGISTRY:-docker.io}/library/mariadb:11@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
  dynamo:
    image: ${REGISTRY:-docker.io}/amazon/dynamodb-local:latest@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
  s3:
    image: ${REGISTRY:-docker.io}/rustfs/rustfs:latest@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
  s3-init:
    image: ${REGISTRY:-docker.io}/amazon/aws-cli:latest@sha256:de807aa682dd3f45d6de5f431b93762691c53f1134b318936dda39f99e321244
